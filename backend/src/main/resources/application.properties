spring.application.name=energy

# DB 접속 정보는 backend/.env 파일에서 읽습니다. (Git에 올라가지 않음, .env.example 참고)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (Supabase, 팀 공용 DB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 팀원 여러 명이 같은 DB에 접속하므로 1인당 연결 수를 적게 유지
spring.datasource.hikari.maximum-pool-size=3

# 시뮬레이터(@Scheduled 작업) 실행 여부. 공용 DB라서 담당자 1명만 .env 에서 true 로 켭니다.
simulator.enabled=${SIMULATOR_ENABLED:false}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# DB 시간을 한국 시간으로 저장/조회
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 실행되는 SQL을 콘솔에 출력
logging.level.org.hibernate.SQL=debug

# Swagger (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
