spring.application.name=energy

# DB 접속 정보는 backend/.env 파일에서 읽습니다. (Git에 올라가지 않음, .env.example 참고)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL 접속 정보 2개(메인 Supabase / 로컬 backup-db)는
# global/config/DataSourceConfig.java 에서 PRIMARY_DB_*, BACKUP_DB_* 값으로 직접 만듭니다.
# (Supabase 장애 시 자동 전환을 위해 Boot 기본 단일 DataSource 설정 대신 직접 구성)
# 팀원 여러 명이 같은 DB에 접속하므로 1인당 연결 수를 적게 유지
spring.datasource.hikari.maximum-pool-size=3

# 시뮬레이터(@Scheduled 작업) 실행 여부. 공용 DB라서 담당자 1명만 .env 에서 true 로 켭니다.
simulator.enabled=${SIMULATOR_ENABLED:false}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# DB 시간을 한국 시간으로 저장/조회
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 실행되는 SQL을 콘솔에 출력
logging.level.org.hibernate.SQL=debug

# Swagger (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# 헬스체크 (Docker/Nginx가 서버 상태 확인용으로 호출)
# liveness: DB 상태와 무관하게 "서버 프로세스가 살아있나"만 봄 (DB 장애 중에도 UP이어야 컨테이너가
# 불필요하게 재시작되지 않음 - DB 장애는 자동 전환 로직이 따로 처리함)
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
