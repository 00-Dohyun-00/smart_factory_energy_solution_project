services:
  backup-db:
    image: postgres:17
    container_name: backup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wattever
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wattever
    ports:
      - "5433:5432"
    volumes:
      - backup-db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  backup-db-data:
